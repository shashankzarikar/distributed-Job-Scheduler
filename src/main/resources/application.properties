spring.application.name=distributed-job-scheduler

server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:job_scheduler}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:job_scheduler_user}
spring.datasource.password=${DB_PASSWORD:Vipromit@1657}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.sql.init.mode=always

# JWT
app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_ENV_FILE}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Worker engine
app.worker.pool-size=${WORKER_POOL_SIZE:5}
app.worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:2000}
app.worker.heartbeat-interval-ms=${WORKER_HEARTBEAT_INTERVAL_MS:10000}
app.worker.heartbeat-timeout-seconds=${WORKER_HEARTBEAT_TIMEOUT_SECONDS:30}
app.worker.reaper-interval-ms=${WORKER_REAPER_INTERVAL_MS:15000}

logging.level.root=INFO
logging.level.com.jobscheduler=DEBUG

app.scheduler.poll-interval-ms=${SCHEDULER_POLL_INTERVAL_MS:2000}
app.scheduler.batch-size=${SCHEDULER_BATCH_SIZE:20}